<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Access | Pods</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            --radius-card: 6px;
            --radius-input: 4px;
            --radius-btn: 4px;
        }

        /* GitHub Dark (Default) */
        :root[data-theme="dark"],
        :root:not([data-theme="light"]) {
            --bg-page: #0d1117;
            --bg-card: #161b22;
            --border-default: #30363d;
            --border-focus: #58a6ff;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-error: #f85149;
            --btn-bg: #238636;
            --btn-hover: #2ea043;
            --btn-text: #ffffff;
            --pill-bg: #21262d;
            --pill-border: #363b42;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
        }

        /* GitHub Light */
        :root[data-theme="light"] {
            --bg-page: #f6f8fa;
            --bg-card: #ffffff;
            --border-default: #d0d7de;
            --border-focus: #0969da;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-error: #cf222e;
            --btn-bg: #1f883d;
            --btn-hover: #1a7f37;
            --btn-text: #ffffff;
            --pill-bg: #eaeef2;
            --pill-border: #d0d7de;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-card);
            box-shadow: var(--card-shadow);
            padding: 32px 28px;
            position: relative;
            transition: all 0.2s ease;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .theme-toggle-btn {
            background-color: var(--pill-bg);
            border: 1px solid var(--pill-border);
            color: var(--text-secondary);
            border-radius: var(--radius-btn);
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
            padding: 0;
        }

        .theme-toggle-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-focus);
        }

        .theme-toggle-btn svg {
            width: 15px;
            height: 15px;
            display: block;
        }

        .auth-title {
            font-size: 19px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .client-info {
            background-color: var(--pill-bg);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-input);
            padding: 12px 14px;
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .info-value-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .client-icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .client-icon-wrapper img {
            width: 18px;
            height: 18px;
            display: block;
            border-radius: 3px;
        }

        .info-value {
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .alert-error {
            background-color: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--text-error);
            border-radius: var(--radius-input);
            color: var(--text-error);
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            font-size: 14px;
            color: var(--text-primary);
            background-color: var(--bg-page);
            border: 1px solid var(--border-default);
            border-radius: var(--radius-input);
            outline: none;
            transition: border-color 0.15s ease, background-color 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--btn-text);
            background-color: var(--btn-bg);
            border: 1px solid rgba(240, 246, 252, 0.1);
            border-radius: var(--radius-btn);
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .btn-submit:hover {
            background-color: var(--btn-hover);
        }

        .form-footer {
            margin-top: 16px;
            text-align: center;
        }

        .link-cancel {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
        }

        .link-cancel:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="header-top">
            <span class="brand-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="8" rx="2" />
                    <rect x="2" y="14" width="20" height="8" rx="2" />
                    <line x1="6" y1="6" x2="6.01" y2="6" />
                    <line x1="6" y1="18" x2="6.01" y2="18" />
                </svg>
                Pods
            </span>
            <button type="button" class="theme-toggle-btn" id="themeToggle" title="Toggle theme"
                aria-label="Toggle theme"></button>
        </div>

        <h1 class="auth-title">Authorize Access</h1>

        <div class="client-info">
            <div class="info-row">
                <span class="info-label">Application</span>
                <div class="info-value-group">
                    <span class="client-icon-wrapper" id="clientIconWrapper"></span>
                    <span class="info-value" id="clientNameDisplay">{{ client_id }}</span>
                </div>
            </div>
            <div class="info-row">
                <span class="info-label">Scope</span>
                <span class="info-value">{{ scope }}</span>
            </div>
        </div>

        {{ error_banner }}

        <form method="POST" action="/oauth/authorize">
            <input type="hidden" name="client_id" value="{{ client_id }}">
            <input type="hidden" name="redirect_uri" value="{{ redirect_uri }}">
            <input type="hidden" name="code_challenge" value="{{ code_challenge }}">
            <input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">
            <input type="hidden" name="state" value="{{ state }}">
            <input type="hidden" name="scope" value="{{ scope }}">

            <div class="form-group">
                <label class="form-label" for="password">Owner Password</label>
                <input class="form-control" type="password" id="password" name="password" required autofocus
                    autocomplete="current-password">
            </div>

            <button class="btn-submit" type="submit">Authorize Application</button>
        </form>

        <div class="form-footer">
            <a class="link-cancel" href="{{ cancel_url }}">Cancel and return to client</a>
        </div>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var themeBtn = document.getElementById('themeToggle');
            var iconWrapper = document.getElementById('clientIconWrapper');
            var clientNameDisplay = document.getElementById('clientNameDisplay');

            // Strictly allowed applications
            var CLIENT_FAVICONS = {
                claude: 'https://www.google.com/s2/favicons?domain=claude.ai&sz=64',
                chatgpt: 'https://www.google.com/s2/favicons?domain=chatgpt.com&sz=64',
                gemini: 'https://www.google.com/s2/favicons?domain=gemini.google.com&sz=64'
            };

            var rawClient = (clientNameDisplay.textContent || '').trim().toLowerCase();
            var activeClient = rawClient;

            // In preview/local mode
            if (rawClient.indexOf('{{') !== -1) {
                activeClient = 'claude';
                clientNameDisplay.textContent = 'claude';
            }

            var faviconUrl = CLIENT_FAVICONS[activeClient];
            if (faviconUrl) {
                iconWrapper.innerHTML = '<img src="' + faviconUrl + '" width="18" height="18" alt="' + activeClient + '" onerror="this.style.display=\'none\'">';
            }

            var SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
            var MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

            function getSystemTheme() {
                return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }

            var currentTheme = localStorage.getItem('auth_theme') || getSystemTheme();

            function updateTheme() {
                root.setAttribute('data-theme', currentTheme);
                themeBtn.innerHTML = currentTheme === 'dark' ? SUN_ICON : MOON_ICON;
                themeBtn.setAttribute('title', currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
                localStorage.setItem('auth_theme', currentTheme);
            }

            themeBtn.addEventListener('click', function () {
                currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
                updateTheme();
            });

            updateTheme();
        })();
    </script>
</body>

</html>
